<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="msgstyle.css">
    <link rel="icon" href="/imgs/batchlogo.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>
<body>
    <nav id="navbar">
        <div class="nav-logo">
            <img src="./imgs/batchlogo.webp" alt="Harinawa Batch Logo" id="logo">
            <p class="nav-text">palanca '26</p>
        </div>
        <p class="nav-text" id="days"></p>
    </nav>
    </div>
    <div class="main">
        <div id="img-cont">
            <img id="settable-img" src="" alt="" class="picture">
            <div id="txt-cont">
                <p id="display-name"></p>
                <p class="poppins" id="section"></p>
            </div>
        </div>
        <form id="msg-form" autocomplete="off" action="">
            <h1 class="hero-text">Leave a message!<h1>
            <p class="poppins">Name (Optional)</p>
            <input id="name" class="poppins" type="text" autocomplete="name">
            <p class="poppins">Message</p>
            <textarea id="msg" class="poppins"></textarea>
            <button id="submit-btn" class="poppins" type="submit">Send</button>
        </form>
    </div>
    <script src="./msgscript.js"></script>
</body>
</html>
